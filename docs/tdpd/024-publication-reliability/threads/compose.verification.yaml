name: contentops-threads-reliability-synthetic
services:
  synthetic-db:
    image: postgres:15-alpine
    platform: linux/amd64
    user: '70:70'
    environment:
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic
      POSTGRES_DB: threads_reliability_synthetic
    volumes: [threads-synthetic-pg:/var/lib/postgresql/data]
    networks: [synthetic]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U synthetic -d threads_reliability_synthetic]
      interval: 2s
      timeout: 2s
      retries: 20
  checks:
    image: planner-reliability-threads:20261019
    platform: linux/amd64
    user: '1000:1000'
    working_dir: /source
    environment:
      DATABASE_URL: postgresql://synthetic:synthetic@synthetic-db:5432/threads_reliability_synthetic
      NODE_PATH: /opt/planner/node_modules
      TS_NODE_PROJECT: /source/tsconfig.json
      TELEGRAM_BOT_TOKEN: synthetic-not-a-token
      PRISMA_SCHEMA_ENGINE_BINARY: /opt/planner/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
    volumes: [../../../../:/source:ro]
    networks: [synthetic]
    depends_on:
      synthetic-db: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 1
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
networks:
  synthetic:
    internal: true
    ipam:
      config: [{subnet: 10.231.83.0/28}]
volumes:
  threads-synthetic-pg:
