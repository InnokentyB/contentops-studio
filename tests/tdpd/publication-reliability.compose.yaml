name: tower-contentops-reliability-verification
services:
  synthetic-db:
    image: postgres:15-alpine
    platform: linux/amd64
    user: '70:70'
    environment:
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic
      POSTGRES_DB: shared_browser_synthetic
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
      - /var/run/postgresql:uid=70,gid=70,mode=0770
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [synthetic]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U synthetic -d shared_browser_synthetic']
      interval: 2s
      timeout: 2s
      retries: 20
  checks:
    image: ${RELIABILITY_TEST_IMAGE:-planner-reliability-integrated:20261019}
    platform: linux/amd64
    user: '1000:1000'
    init: true
    working_dir: /opt/planner
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /opt/planner/logs:rw,nosuid,nodev,size=16m,mode=1777
    environment:
      DATABASE_URL: postgresql://synthetic:synthetic@synthetic-db:5432/shared_browser_synthetic
      BROWSER_RECOVERY_V2_ENABLED: 'true'
      NODE_PATH: /opt/planner/node_modules
      TS_NODE_PROJECT: /source/tsconfig.json
      TELEGRAM_BOT_TOKEN: synthetic-not-a-token
      JWT_SECRET: synthetic-verification-only
      SHARED_BROWSER_DIST: /opt/planner/dist
      PRISMA_SCHEMA_ENGINE_BINARY: /opt/planner/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
    volumes: [../..:/source:ro, ../..:/workspace:ro]
    networks: [synthetic]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
    depends_on:
      synthetic-db: {condition: service_healthy}
networks:
  synthetic:
    internal: true
    ipam:
      config: [{subnet: 10.231.86.0/28}]
