version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contentops_studio_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contentops_studio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: contentops_studio_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
