name: 🛸 Code Quality & Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  shared-browser-contract:
    name: Shared browser publication contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build reviewed non-root compiler/test image (no application startup)
        run: docker compose -f ops/quality/compose.yaml --profile build build build-check
      - name: Dynamic package, permission, lease, one-attempt, fact and bypass contracts
        run: |
          docker compose -f ops/quality/compose.yaml --profile build run --rm build-check node --test --test-concurrency=1 /workspace/tests/tdpd/shared-browser-release.test.cjs /workspace/tests/tdpd/shared-browser-execution.test.cjs /workspace/tests/tdpd/shared-browser-confirmation.test.cjs /workspace/tests/tdpd/shared-browser-fences.test.cjs /workspace/tests/tdpd/shared-browser-mcp.test.cjs /workspace/tests/tdpd/shared-setka-browser.test.cjs /workspace/tests/tdpd/shared-browser-diagnostics.test.cjs
      - name: Owned publication principal, queue, fact and mutator boundaries (no provider)
        run: |
          docker compose -f ops/quality/compose.yaml --profile build run --rm -e TELEGRAM_BOT_TOKEN=000000:synthetic-test-token-never-used-for-provider-calls build-check node --test --test-concurrency=1 /workspace/tests/tdpd/owned-publication-boundary.test.cjs /workspace/tests/tdpd/owned-publication-writers.test.cjs /workspace/tests/tdpd/owned-publication-queue.test.cjs /workspace/tests/tdpd/owned-publication-fact-hook.test.cjs /workspace/tests/tdpd/owned-publication-http.test.cjs /workspace/tests/tdpd/owned-publication-default-route.test.cjs /workspace/tests/tdpd/owned-publication-art.test.cjs
      - name: Signed X bridge, native fences and deterministic extension package (no provider)
        run: |
          docker compose -f ops/quality/compose.yaml --profile build run --rm -w /workspace build-check sh -c 'node --test --test-concurrency=1 /opt/planner/dist/tests/x_native*.test.js /workspace/tests/tdpd/shared-x-native.test.cjs /workspace/tests/tdpd/x-native-bridge.test.cjs /workspace/tests/tdpd/x-native-wiring.test.cjs /workspace/tests/tdpd/x-native-extension-package.test.mjs /workspace/tests/tdpd/x-native-local-boundary.test.mjs /workspace/tests/tdpd/x-native-popup.test.mjs /workspace/tests/tdpd/x-native-package-build.test.mjs /workspace/tests/tdpd/x-native-bundle-binding.test.mjs /workspace/tests/tdpd/x-native-sandbox-boundary.test.cjs /workspace/tests/tdpd/x-native-state-read.test.cjs'
      - name: Real isolated PostgreSQL race and rollback scenarios
        run: |
          docker compose -f ops/publication-tests/compose.yaml up -d synthetic-db
          docker compose -f ops/publication-tests/compose.yaml run --rm tests node node_modules/prisma/build/index.js db push
          docker compose -f ops/publication-tests/compose.yaml run --rm tests
          X_NATIVE_TEST_IMAGE=planner-policy-build-check:node24 docker compose -f ops/publication-tests/compose.yaml -f tests/tdpd/x-native-postgres.compose.yaml run --rm tests
          X_NATIVE_TEST_IMAGE=planner-policy-build-check:node24 docker compose -f ops/publication-tests/compose.yaml -f tests/tdpd/x-native-postgres.compose.yaml run --rm tests node --test --test-concurrency=1 /workspace/tests/tdpd/x-native-state-read-postgres.test.cjs /workspace/tests/tdpd/x-native-state-read-load.test.cjs
      - name: Owned publication PostgreSQL lifecycle, receipt and rollback scenarios
        run: |
          OWNED_PUBLICATION_TEST_IMAGE=planner-policy-build-check:node24 docker compose -p planner-owned-lifecycle-ci -f ops/publication-tests/compose.yaml -f tests/fixtures/owned-publication-store.compose.yaml run --rm tests
      - name: Remove only the synthetic in-memory database stack
        if: always()
        run: |
          docker compose -f ops/publication-tests/compose.yaml down
          docker compose -p planner-owned-lifecycle-ci -f ops/publication-tests/compose.yaml -f tests/fixtures/owned-publication-store.compose.yaml down
  dzen1002-runtime-contract:
    name: Dzen1002 durable attempt and receipt contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dzen_synthetic
          POSTGRES_PASSWORD: dzen_synthetic_only
          POSTGRES_DB: dzen_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dzen_synthetic -d dzen_store_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TELEGRAM_BOT_TOKEN: '000000:synthetic-test-token-never-used-for-provider-calls'
      DATABASE_URL: 'postgresql://fixture:fixture@127.0.0.1:1/fixture'
      DZEN1002_TEST_DATABASE_URL: 'postgresql://dzen_synthetic:dzen_synthetic_only@127.0.0.1:5432/dzen_store_test'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - name: Bounded commands, fact bypass and native fixtures without provider access
        run: |
          node --test --test-concurrency=1 tests/tdpd/dzen1002-runtime.test.cjs tests/tdpd/dzen1002-fact-boundary.test.cjs tests/tdpd/dzen1002-store-custody.test.cjs tests/tdpd/dzen1002-native-*.cjs
          node --test --test-concurrency=1 dist/tests/dzen1002*.test.js dist/tests/dzen_task1002_route.test.js dist/tests/dzen_task_publication.service.test.js dist/tests/remote_mcp_auth.test.js dist/tests/delivery.service.test.js
      - name: Real PostgreSQL races, rollback and post-submit receipt custody
        run: |
          npx prisma db push --config tests/fixtures/dzen1002-store-prisma.config.ts
          node --test --test-concurrency=1 tests/tdpd/dzen1002-store.test.cjs
      - run: npm run quality:gate
        env:
          RUNTIME_POLICY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
  linkedin1128-contract:
    name: LinkedIn1128 claimed-WI lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TELEGRAM_BOT_TOKEN: '000000:synthetic-test-token-never-used-for-provider-calls'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - name: Install pinned bundle build dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Build isolated consumer fixture artifact
        run: npm run build:vk:connector
      - name: Install Chrome for loopback-only browser regression fixtures
        run: npx puppeteer browsers install chrome
      - name: Install Chromium for local Playwright DOM fixtures
        run: npx playwright install chromium
      - name: Full backend regression with synthetic auth and bundled consumer
        env:
          # Legacy recurring-trigger fixtures assert Lisbon wall-clock dates.
          TZ: Europe/Lisbon
          JWT_SECRET: 'synthetic-regression-secret-not-a-production-key'
          DATABASE_URL: 'postgresql://synthetic:synthetic@127.0.0.1:1/synthetic'
        run: |
          while IFS= read -r source; do
            target="${source/src\//dist/}"
            target="${target%.ts}.js"
            echo "::group::${target}"
            timeout 60s node --test --test-concurrency=1 "$target"
            echo "::endgroup::"
          done < <(find src/tests -name '*.test.ts' -print | sort)
      - name: Mocked existing-WI and principal contracts (no provider calls)
        run: |
          node --test --test-concurrency=1 tests/tdpd/linkedin1086-recovery.red.test.cjs tests/tdpd/linkedin1086-control.unit.test.js tests/tdpd/linkedin1086-lifecycle.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1135.unit.test.js dist/tests/linkedin1135_contract.test.js
          node --test --test-concurrency=1 tests/tdpd/review-handoff-repair.unit.test.js dist/tests/manual_only_handoff.test.js
          node --test --test-concurrency=1 dist/tests/dzen1002_manifest_fence.test.js dist/tests/dzen_task1002_route.test.js dist/tests/dzen1002_inventory*.test.js
          node --test --test-concurrency=1 dist/tests/linkedin1128*.test.js dist/tests/linkedin_browser_owner_release.test.js dist/tests/remote_mcp_auth.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1128-store.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1128-lease.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1128-rev3*.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/manifest-transaction.unit.test.js
          node --test --test-concurrency=1 dist/tests/exact_owned_route_guard.test.js dist/tests/vk_generic_publication_route.test.js
  threads1114-contract:
    name: Threads1114 exact lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: codex_lifecycle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_lifecycle_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TELEGRAM_BOT_TOKEN: '000000:synthetic-test-token-never-used-for-provider-calls'
      TDPD_TEST_DATABASE_URL: 'postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/codex_lifecycle_ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - name: Isolated provider and transaction contract mocks (no live credentials)
        run: |
          node --test --test-concurrency=1 dist/tests/threads1114*.test.js dist/tests/threads_generic_release.test.js dist/tests/threads_verified_publication.test.js dist/tests/threads_publication.test.js dist/tests/threads1110_current_manifest_tool.test.js dist/tests/remote_mcp_auth.test.js dist/tests/threads_engagement.test.js dist/tests/threads_task_publication.service.test.js dist/tests/threads_pending_release.test.js
          node --test --test-concurrency=1 tests/tdpd/threads1114-store.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/manifest-transaction.unit.test.js
      - name: Real PostgreSQL CAS race in an ephemeral CI database only
        run: |
          DATABASE_URL="$TDPD_TEST_DATABASE_URL" npx prisma db push
          node --test --test-concurrency=1 tests/tdpd/threads1114-postgres.integration.test.js
          node --test --test-concurrency=1 tests/tdpd/review-handoff-postgres.integration.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1135-postgres.integration.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1086-recovery-postgres.integration.test.js
  audit:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install existing static-parser dependencies without application startup
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Offline policy positive and negative acceptance scenarios
        run: node --test --test-concurrency=1 tests/tdpd/runtime-policy-collector.test.cjs tests/tdpd/runtime-policy-gate.test.cjs tests/tdpd/runtime-policy-transition.proposed.cjs tests/tdpd/runtime-policy-transition-resources.proposed.cjs tests/tdpd/runtime-policy-budget.test.cjs

      - name: 🔍 Run Automated Code Quality & Security Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/audit_code_quality.mjs --github-summary --comment-pr

      - name: 🛑 Enforce no-regression and operational safety contracts
        env:
          RUNTIME_POLICY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run quality:gate

      # Optional: To fail the build when score is below threshold, uncomment:
      # - name: 🛑 Quality Gate Assertion
      #   run: |
      #     node scripts/audit_code_quality.mjs --fail-under=60
