name: 🛸 Code Quality & Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  linkedin1128-contract:
    name: LinkedIn1128 claimed-WI lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TELEGRAM_BOT_TOKEN: '000000:synthetic-test-token-never-used-for-provider-calls'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - name: Mocked existing-WI and principal contracts (no provider calls)
        run: |
          node --test --test-concurrency=1 dist/tests/linkedin1128*.test.js dist/tests/linkedin_browser_owner_release.test.js dist/tests/remote_mcp_auth.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1128-store.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1128-lease.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/linkedin1128-rev3*.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/manifest-transaction.unit.test.js
          node --test --test-concurrency=1 dist/tests/exact_owned_route_guard.test.js dist/tests/vk_generic_publication_route.test.js
  threads1114-contract:
    name: Threads1114 exact lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: codex_lifecycle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_lifecycle_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      TELEGRAM_BOT_TOKEN: '000000:synthetic-test-token-never-used-for-provider-calls'
      TDPD_TEST_DATABASE_URL: 'postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/codex_lifecycle_ci'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:backend
      - name: Isolated provider and transaction contract mocks (no live credentials)
        run: |
          node --test --test-concurrency=1 dist/tests/threads1114*.test.js dist/tests/threads_verified_publication.test.js dist/tests/threads_publication.test.js dist/tests/threads1110_current_manifest_tool.test.js dist/tests/remote_mcp_auth.test.js dist/tests/threads_engagement.test.js dist/tests/threads_task_publication.service.test.js dist/tests/threads_pending_release.test.js
          node --test --test-concurrency=1 tests/tdpd/threads1114-store.unit.test.js
          node --test --test-concurrency=1 tests/tdpd/manifest-transaction.unit.test.js
      - name: Real PostgreSQL CAS race in an ephemeral CI database only
        run: |
          DATABASE_URL="$TDPD_TEST_DATABASE_URL" npx prisma db push
          node --test --test-concurrency=1 tests/tdpd/threads1114-postgres.integration.test.js
  audit:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Run Automated Code Quality & Security Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/audit_code_quality.mjs --github-summary --comment-pr

      - name: 🛑 Enforce no-regression and operational safety contracts
        run: npm run quality:gate

      # Optional: To fail the build when score is below threshold, uncomment:
      # - name: 🛑 Quality Gate Assertion
      #   run: |
      #     node scripts/audit_code_quality.mjs --fail-under=60
