name: planner-egress-verification
services:
  checks:
    image: ${EGRESS_TEST_IMAGE:-planner-terminal-original-cua:20261025}
    platform: linux/amd64
    user: '1000:1000'
    working_dir: /tmp
    read_only: true
    networks: [egress]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=768m,mode=1777']
    volumes: ['../..:/source:ro']
    environment:
      NODE_PATH: /opt/planner/node_modules
      NODE_OPTIONS: --max-old-space-size=2048
      EGRESS_DIST: /tmp/project/dist
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/synthetic
      TELEGRAM_BOT_TOKEN: synthetic-not-a-token
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
    entrypoint: [sh, /source/ops/egress/checks.sh]
  python-checks:
    image: tower/contentops-postgres-backup:18
    platform: linux/amd64
    user: '1000:1000'
    read_only: true
    network_mode: none
    tmpfs: ['/tmp:rw,exec,nosuid,nodev,size=32m,mode=1777']
    volumes: ['../..:/source:ro']
    entrypoint: [python3, /source/tests/egress/backup_test.py]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  db:
    image: postgres:15-alpine
    platform: linux/amd64
    user: '70:70'
    environment: {POSTGRES_USER: synthetic, POSTGRES_PASSWORD: synthetic, POSTGRES_DB: shared_browser_synthetic}
    tmpfs: ['/var/lib/postgresql/data:rw,uid=70,gid=70,mode=0700', '/var/run/postgresql:rw,uid=70,gid=70,mode=0770']
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U synthetic -d shared_browser_synthetic']
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [egress]
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    user: '999:999'
    read_only: true
    command: [redis-server, --save, '', --appendonly, 'no', --dir, /tmp]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=16m,mode=1777']
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [egress]
  postgres-checks:
    extends: checks
    networks: [egress]
    environment:
      DATABASE_URL: postgresql://synthetic:synthetic@db:5432/shared_browser_synthetic
      EGRESS_POSTGRES: '1'
      EGRESS_REDIS_URL: redis://redis:6379
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
networks:
  egress: {internal: true, ipam: {config: [{subnet: 10.238.106.0/28}]}}
