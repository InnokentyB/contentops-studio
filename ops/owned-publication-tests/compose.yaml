name: planner-owned-publication-synthetic
services:
  native-tests:
    image: tower-browser-checks:20261016
    platform: linux/amd64
    user: "1000:1000"
    init: true
    restart: "no"
    read_only: true
    network_mode: none
    working_dir: /workspace
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    shm_size: 512m
    ulimits: {core: 0}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=768m,mode=1777
    volumes:
      - ../..:/workspace:ro
    environment:
      HOME: /tmp
      NODE_PATH: /app/node_modules
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      TZ: Europe/Lisbon
    command: [node, --test, --test-concurrency=1, tests/tdpd/owned-publication-adapter-native.cjs, tests/tdpd/owned-publication-adapter-proof.cjs]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
